<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Mata Pelajaran</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 min-h-screen">
    <nav class="bg-slate-900 border-b border-slate-800 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 py-3 md:px-6 md:py-4 flex justify-between items-center">
            <h2 class="text-lg md:text-xl font-bold text-white tracking-tight">Portal Ujian</h2>
            <a href="index.html" class="flex items-center gap-2 text-slate-400 hover:text-white font-medium transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                <span class="hidden sm:inline">Home</span>
            </a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6">
        <div id="subjectGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
            <!-- JavaScript will render 22 subjects here -->
        </div>
    </main>

    <!-- Modal Login -->
    <div id="loginModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-8 w-full max-w-md shadow-2xl">
            <h3 id="modalTitle" class="text-2xl font-bold text-blue-500 mb-6 text-center uppercase tracking-widest">Login Ujian</h3>
            <form id="formLogin" class="space-y-4">
                <input type="text" id="nama" placeholder="Nama Lengkap" required class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:ring-2 focus:ring-blue-500 outline-none transition">
                <input type="text" id="nomor" placeholder="Nomor Ujian" required class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:ring-2 focus:ring-blue-500 outline-none transition">
                <input type="text" id="token" placeholder="Token" required class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:ring-2 focus:ring-blue-500 outline-none transition">
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="closeModal()" class="flex-1 py-3 text-slate-400 font-medium hover:bg-slate-800 rounded-xl transition">Batal</button>
                    <button type="submit" class="flex-1 py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-lg transition shadow-blue-900/20">Masuk</button>
                </div>
            </form>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="main.js"></script>
</body>
</html>
